<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Enhanced Branding Assets -->
<link rel="manifest" href="/static/manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ace Aviation Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="/static/manifest.json">
    <style>
        .gold-gradient { background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%); }
        .dark-card { background-color: #1e293b; border: 1px solid rgba(212, 175, 55, 0.15); }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased">

    <!-- Premium Clean Header -->
    <nav class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-6 py-4 flex justify-between items-center">
        <a href="/" class="flex items-center space-x-3">
            <div class="p-2 gold-gradient rounded-lg text-slate-950 font-black tracking-wider shadow-md">ACE</div>
            <span class="text-xl font-bold uppercase tracking-wider bg-gradient-to-r from-amber-200 to-amber-500 bg-clip-text text-transparent">Aviation</span>
        </a>
        <div class="text-xs font-mono text-slate-400 border border-slate-800 px-3 py-1.5 rounded-full bg-slate-950">
            <i class="fa-solid fa-shield-halved text-amber-400 mr-1"></i> Public Catalog Mode
        </div>
    </nav>

<!-- Content Target Zone -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Mobile Install & Sync Script -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/static/service-worker.js')
                    .then(reg => console.log('Mobile Matrix Service Worker Registered!'))
                    .catch(err => console.log('Sync Registration Blocked: ', err));
            });
        }
    </script>
</body>
</html>
