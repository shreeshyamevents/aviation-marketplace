name: Nightly AI Aircraft Scraper

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install beautifulsoup4 google-generativeai

      - name: Run AI Scraper Script
        working-directory: ./aviation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scraper.py

      - name: Commit & Push Inventory Updates
        working-directory: ./aviation
        run: |
          git config --global user.name "Ace-Aviation-Bot"
          git config --global user.email "bot@aceaviation.com"
          git add inventory.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-updated inventory via Gemini AI Engine" && git push)
